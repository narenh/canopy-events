<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>__PAGE_TITLE__</title>
<meta name="theme-color" content="#03120c">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/events.css">
</head>
<!-- Your friends (/friends): your friend link (GET /api/v1/me/friend-link)
     with its QR code (drawn by the server, lib/qr.js), Share, Copy and
     Reset (POST .../reset); adding someone by phone or Instagram (POST
     /api/v1/people/lookup, then POST /api/v1/me/friends); and your list
     (GET /api/v1/me/friends), each with Remove (DELETE
     /api/v1/me/friends/<id>, asked first); your lists (GET
     /api/v1/me/lists), a row each opening the list's sheet: its link,
     Share, Copy, its QR code (/l/<code>/qr.svg), Rename, Reset link,
     Delete, who's on it (.../members) with Remove, and Add people (POST
     .../members, with the invite sheet's picker); making a new one; and
     the lists you're on (GET /api/v1/me/list-memberships), with Leave.
     Drawn by public/ui.js (friendsPage, listSheet). -->
<body class="mesh-bg">
<!-- PAGE:HEADER -->
<main class="wrap">
  <!-- PAGE:BANNER -->
  <div id="main" class="stack"><!-- PAGE:MAIN --></div>
</main>
<!-- PAGE:FOOTER -->
<script type="application/json" id="pageData">__PAGE_DATA__</script>
<script src="/copy.js"></script>
<script src="/ui.js"></script>
<script src="/events.js"></script>
<script src="/sheets.js"></script>
<script>
applyCopy();

const data = pageData();
const listEl = document.getElementById('friendList');
const shown = new Set(data.friends.map((f) => f.person.id));

// Says `text` in the notice or error `id`, clearing the other one of the
// pair (linkNotice and linkError, say).
function say(id, text){
  const prefix = id.replace(/(Notice|Error)$/, '');
  [prefix + 'Notice', prefix + 'Error'].forEach((x) => { const el = document.getElementById(x); if (el) el.textContent = ''; });
  const el = document.getElementById(id);
  if (el) el.textContent = text;
}

function emptyCheck(){
  document.getElementById('noFriends').classList.toggle('hidden', listEl.children.length > 0);
}

// ---------------- Your friend link ----------------

async function copyLink(url){
  try{
    await navigator.clipboard.writeText(url);
    say('linkNotice', t('friends.copied'));
  }catch(e){
    window.prompt('', url);
  }
}

// ---------------- Adding by phone or Instagram ----------------
//
// The invite page's lookup, with "Add friend" for the person it finds.
// What's typed decides which to ask: anything with a letter or starting
// with @ is an Instagram username, otherwise it's a phone number.
const lookupForm = document.getElementById('lookupForm');
let found = null;

function drawFound(){
  document.getElementById('lookupResult').innerHTML = found ? UI.friendFound(found, shown.has(found.id)) : '';
}

if (lookupForm){
  lookupForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = document.getElementById('lookupQuery').value.trim();
    found = null;
    drawFound();
    if (!q){ say('lookupError', COPY.friends.errors.one_of); return; }
    const kind = /^@|[a-z]/i.test(q) ? 'instagram' : 'phone';
    let after = null;
    busy(document.getElementById('lookupBtn'), document.getElementById('lookupError'), async () => {
      const { res, data: d } = await api('POST', '/people/lookup', { [kind]: q }, { stay: true });
      if (res.ok){
        found = d.person && d.person.id !== data.me.id ? d.person : null;
        drawFound();
        if (!found) after = ['lookupNotice', t('friends.lookupNone')];
        return;
      }
      if (d.reason === 'lookup_not_allowed'){
        document.getElementById('lookup').innerHTML = '<h3>' + UI.tx('friends.lookupHeading') + '</h3><p style="margin:0">' + UI.tx('friends.lookupOff') + '</p>';
        return;
      }
      after = ['lookupError', COPY.friends.errors[d.reason] || sentence(d.error)];
    }).then(() => { if (after) say(after[0], after[1]); });
  });
}

// ---------------- Your lists ----------------
//
// Each list is a row; the row opens the list's sheet (public/ui.js
// listSheet; public/sheets.js opens it): its link with Share, Copy and
// its QR code (an image the server draws, /l/<code>/qr.svg), Rename,
// Reset link and Delete, and who's on it, searchable, with Remove. "Add
// people" turns the sheet into the picker (the invite sheet's), with
// everyone on the list greyed, and "Add 5"; back (or Escape) returns.
// `ls.st` is the open list's state.
const ls = { st: null, pickers: {} };

function listOf(id){
  return (data.lists || []).find((l) => l.id === id);
}
function drawListRows(){
  const box = document.getElementById('ownLists');
  if (box) box.innerHTML = (data.lists || []).map(UI.ownListRow).join('');
}

function listRefusal(d){
  return (COPY.lists.errors[d.reason] && t('lists.errors.' + d.reason)) || sentence(d.error);
}

async function copyListLink(url){
  try{
    await navigator.clipboard.writeText(url);
    say('listNotice', t('lists.copied'));
  }catch(e){
    window.prompt('', url);
  }
}

// The sheet's list part again (not the heading), focus on `focus`. What
// it says (a notice, an error) stays.
function drawListBody(focus){
  const box = document.getElementById('listBody');
  if (!box) return;
  const kept = ['listNotice', 'listError'].map((id) => { const el = document.getElementById(id); return el ? el.textContent : ''; });
  box.innerHTML = UI.listSheetBody(ls.st);
  ['listNotice', 'listError'].forEach((id, i) => { const el = document.getElementById(id); if (el) el.textContent = kept[i]; });
  const el = focus && box.querySelector(focus);
  if (el) el.focus();
}
function drawListMembers(){
  const box = document.getElementById('listMembers');
  if (box) box.innerHTML = UI.listMembersResults(ls.st);
}

// Everyone on it, newest first (1,000 at most: ten pages).
async function loadMembers(){
  const r = await allPages('/me/lists/' + encodeURIComponent(ls.st.list.id) + '/members', 'members', 10);
  if (!ls.st) return;
  ls.st.members = r.items;
}

async function openList(id, opener, extra){
  const l = listOf(id);
  if (!l) return;
  ls.st = Object.assign({ list: l, members: null, query: '', mode: 'members', qr: false, editing: false }, extra || {});
  activePicker = null;
  openSheet(UI.listSheet(ls.st), { opener, fallback: 'ownLists', onClose: () => { ls.st = null; drawListRows(); }, onEscape: listEscape });
  try{
    await loadMembers();
  }catch(e){
    say('listError', t(e instanceof AccountsDown ? 'common.accountsDown' : 'common.unreachable'));
  }
  if (ls.st && ls.st.mode === 'members') drawListBody(null);
}

// Escape: from adding people, back to the list; otherwise closed.
function listEscape(){
  if (ls.st && ls.st.mode === 'add') backToList();
  else closeSheet();
}

function backToList(said){
  ls.st.mode = 'members';
  activePicker = null;
  swapSheet(UI.listSheet(ls.st), '[data-action="add-people"]');
  if (said) say('listNotice', said);
}

// "Add people": the picker, one per list, kept while the page is open
// (so a second visit doesn't fetch everything again).
async function addPeople(){
  const st = ls.st;
  const id = st.list.id;
  if (!ls.pickers[id]){
    ls.pickers[id] = makePicker({
      kind: 'list', me: data.me, skipList: id,
      loadTaken: async () => {
        if (!ls.st || ls.st.list.id !== id || !ls.st.members) await loadMembers();
        const on = {};
        (ls.st ? ls.st.members || [] : []).forEach((m) => { on[m.person.id] = 'on_list'; });
        return on;
      }
    });
  }
  const p = ls.pickers[id];
  st.picker = p.start();
  st.mode = 'add';
  swapSheet(UI.listSheet(st), '#inviteSearch');
  await p.load();
}

// Making one: a name, nothing else. It goes at the end, and its sheet
// opens with its QR code showing.
const createForm = document.getElementById('createList');
if (createForm){
  createForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('newListName');
    const name = input.value.trim();
    if (!name){ input.focus(); return; }
    let refused = '';
    let made = null;
    busy(document.getElementById('createListBtn'), document.getElementById('listsError'), async () => {
      const { res, data: d } = await api('POST', '/me/lists', { name });
      if (!res.ok){ refused = listRefusal(d); return; }
      data.lists = (data.lists || []).concat([d.list]);
      input.value = '';
      drawListRows();
      made = d.list;
    }).then(() => {
      if (refused) say('listsError', refused);
      if (made) openList(made.id, document.querySelector('#list-' + made.id + ' .list-open'), { qr: true });
    });
  });
}

// Renaming, in the sheet.
sheetBox.addEventListener('submit', (e) => {
  if (e.target.id !== 'renameList') return;
  e.preventDefault();
  const l = ls.st.list;
  const name = document.getElementById('renameInput').value.trim();
  let refused = '';
  busy(e.target.querySelector('button[type=submit]'), document.getElementById('listError'), async () => {
    const { res, data: d } = await api('PATCH', '/me/lists/' + encodeURIComponent(l.id), { name });
    if (!res.ok){ refused = listRefusal(d); return; }
    l.name = d.list.name;
    ls.st.editing = false;
    swapSheet(UI.listSheet(ls.st), '[data-action="rename-list"]');
  }).then(() => { if (refused) say('listError', refused); });
});

sheetBox.addEventListener('input', (e) => {
  if (e.target.id !== 'memberSearch' || !ls.st) return;
  ls.st.query = e.target.value;
  drawListMembers();
});

onActions({
  'open-list': (btn) => openList(btn.getAttribute('data-list'), btn),
  'close-list': () => closeSheet(),
  'list-back': () => backToList(),
  'add-people': () => addPeople(),
  'share-list': async (btn) => {
    const url = btn.getAttribute('data-url');
    if (navigator.share){
      try{ await navigator.share({ title: btn.getAttribute('data-name'), url }); }catch(e){}
      return;
    }
    copyListLink(url);
  },
  'copy-list': (btn) => copyListLink(btn.getAttribute('data-url')),
  'toggle-qr': () => {
    ls.st.qr = !ls.st.qr;
    drawListBody('[data-action="toggle-qr"]');
  },
  'rename-list': () => {
    ls.st.editing = true;
    drawListBody('#renameInput');
  },
  'cancel-rename': () => {
    ls.st.editing = false;
    drawListBody('[data-action="rename-list"]');
  },
  // A new link: the old one and its QR code stop working; everyone stays.
  'reset-list': (btn) => {
    const l = ls.st.list;
    if (!confirm(t('lists.resetConfirm', { name: l.name }))) return;
    let refused = '';
    busy(btn, document.getElementById('listError'), async () => {
      const { res, data: d } = await api('POST', '/me/lists/' + encodeURIComponent(l.id) + '/reset-link');
      if (!res.ok){ refused = listRefusal(d); return; }
      Object.assign(l, { code: d.list.code, url: d.list.url });
      drawListBody('[data-action="reset-list"]');
    }).then(() => { if (refused) say('listError', refused); });
  },
  'delete-list': (btn) => {
    const l = ls.st.list;
    if (!confirm(t('lists.deleteConfirm', { name: l.name }))) return;
    let refused = '';
    busy(btn, document.getElementById('listError'), async () => {
      const { res, data: d } = await api('DELETE', '/me/lists/' + encodeURIComponent(l.id));
      if (!res.ok && d.reason !== 'list_not_found'){ refused = listRefusal(d); return; }
      data.lists = data.lists.filter((x) => x.id !== l.id);
      delete ls.pickers[l.id];
      closeSheet();
      const first = document.querySelector('#ownLists .list-open') || document.getElementById('newListName');
      if (first) first.focus();
    }).then(() => { if (refused) say('listError', refused); });
  },
  // Taking someone off: asked first; they aren't told.
  'remove-member': (btn) => {
    const l = ls.st.list;
    const id = btn.getAttribute('data-person');
    if (!confirm(t('lists.removeConfirm', { name: btn.getAttribute('data-name'), list: l.name }))) return;
    let refused = '';
    busy(btn, document.getElementById('listError'), async () => {
      const { res, data: d } = await api('DELETE', '/me/lists/' + encodeURIComponent(l.id) + '/members/' + encodeURIComponent(id));
      if (!res.ok && d.reason !== 'not_a_member'){ refused = listRefusal(d); return; }
      ls.st.members = ls.st.members.filter((m) => m.person.id !== id);
      l.memberCount = Math.max(0, l.memberCount - 1);
      drawListBody(ls.st.query ? '#memberSearch' : '[data-action="add-people"]');
    }).then(() => { if (refused) say('listError', refused); });
  },
  // "Add 5": up to 100 a request (what the API takes); then back to the
  // list, fetched again, saying how many and what it invited them to.
  'add-to-list': (btn) => {
    const st = ls.st;
    const p = ls.pickers[st.list.id];
    const ids = p.st.selected.filter(p.pickable);
    if (!ids.length) return;
    let refused = '';
    let added = 0;
    let invitedTo = 0;
    let said = '';
    busy(btn, document.getElementById('inviteError'), async () => {
      for (let i = 0; i < ids.length; i += 100){
        const { res, data: d } = await api('POST', '/me/lists/' + encodeURIComponent(st.list.id) + '/members', { personIds: ids.slice(i, i + 100) });
        if (!res.ok){ refused = d.reason === 'rate_limited' ? t('lists.addLimited') : listRefusal(d); break; }
        d.added.forEach((x) => { p.st.onList[x.id] = 'on_list'; });
        d.alreadyOn.forEach((x) => { p.st.onList[x] = 'on_list'; });
        added += d.added.length;
        invitedTo = Math.max(invitedTo, d.invitedTo);
        Object.assign(st.list, { memberCount: d.list.memberCount });
      }
      p.st.selected = p.st.selected.filter(p.pickable);
      if (refused){ p.drawResults(); p.drawTray(); return; }
      said = (added === 0 ? t('lists.addedNone') : added === 1 ? t('lists.addedOne') : t('lists.addedSome', { count: added }))
        + (invitedTo ? ' ' + (invitedTo === 1 ? t('lists.invitedThemOne') : t('lists.invitedThem', { count: invitedTo })) : '');
      backToList(said);
      await loadMembers();
      if (!ls.st || ls.st.mode !== 'members') return;
      const onAdd = document.activeElement && document.activeElement.matches('[data-action="add-people"]');
      drawListBody(onAdd ? '[data-action="add-people"]' : null);
    }).then(() => { if (refused) say('inviteError', refused); });
  },
  // Leaving a list you're on: asked first; the owner isn't told.
  'leave-list': (btn) => {
    if (!confirm(t('lists.leaveConfirm', { list: btn.getAttribute('data-name'), first: btn.getAttribute('data-first') }))) return;
    let refused = '';
    busy(btn, document.getElementById('membershipsError'), async () => {
      const { res, data: d } = await api('DELETE', '/me/list-memberships/' + encodeURIComponent(btn.getAttribute('data-list')));
      if (!res.ok && d.reason !== 'not_a_member'){ refused = sentence(d.error); return; }
      const list = btn.closest('ul');
      btn.closest('li').remove();
      if (!list.children.length) document.getElementById('memberships').remove();
    }).then(() => { if (refused) document.getElementById('membershipsError').textContent = refused; });
  }
});

onActions({
  'share-link': async (btn) => {
    const url = btn.getAttribute('data-url');
    if (navigator.share){
      try{ await navigator.share({ title: t('friends.linkHeading'), url }); }catch(e){}
      return;
    }
    copyLink(url);
  },
  'copy-link': (btn) => copyLink(btn.getAttribute('data-url')),
  select: (el) => el.select(),

  // A new link: the old one (and its QR code) stops working. The page is
  // drawn again by the server, which draws the new QR code.
  'reset-link': (btn) => {
    if (!confirm(t('friends.resetConfirm'))) return;
    let refused = '';
    busy(btn, document.getElementById('linkError'), async () => {
      const { res, data: d } = await api('POST', '/me/friend-link/reset');
      if (!res.ok){ refused = sentence(d.error); return; }
      window.location.reload();
    }).then(() => { if (refused) say('linkError', refused); });
  },

  // Adding the person a lookup found: one way, they aren't told. They go
  // at the top of the list.
  'add-found': (btn) => {
    const id = btn.getAttribute('data-person');
    const name = btn.getAttribute('data-name');
    let after = null;
    busy(btn, document.getElementById('lookupError'), async () => {
      const { res, data: d } = await api('POST', '/me/friends', { personId: id }, { stay: true });
      if (!res.ok){ after = ['lookupError', COPY.friends.errors[d.reason] || sentence(d.error)]; return; }
      if (!shown.has(id)){
        listEl.insertAdjacentHTML('afterbegin', UI.friendRows([d.friend]));
        shown.add(id);
        emptyCheck();
      }
      drawFound();
      after = ['lookupNotice', t('friends.added', { name })];
    }).then(() => { if (after) say(after[0], after[1]); });
  },

  // Taking someone out, after asking. Quietly: they aren't told.
  // Taking invitations from someone again: their row goes, and the card
  // with the last one.
  'undo-optout': (btn) => {
    let refused = '';
    busy(btn, document.getElementById('optoutsError'), async () => {
      const { res, data: d } = await api('DELETE', '/me/invite-optouts/' + encodeURIComponent(btn.getAttribute('data-person')));
      if (!res.ok){ refused = sentence(d.error); return; }
      const list = btn.closest('ul');
      btn.closest('li').remove();
      if (!list.children.length) document.getElementById('optouts').remove();
    }).then(() => { if (refused) document.getElementById('optoutsError').textContent = refused; });
  },

  'remove-friend': (btn) => {
    const id = btn.getAttribute('data-person');
    if (!confirm(t('friends.removeConfirm', { name: btn.getAttribute('data-name') }))) return;
    let refused = '';
    busy(btn, document.getElementById('friendsError'), async () => {
      const { res, data: d } = await api('DELETE', '/me/friends/' + encodeURIComponent(id));
      // Already gone (another tab): the same as done.
      if (!res.ok && d.reason !== 'not_a_friend'){ refused = sentence(d.error); return; }
      const row = btn.closest('li');
      if (row) row.remove();
      shown.delete(id);
      emptyCheck();
      if (found && found.id === id) drawFound();
    }).then(() => { if (refused) say('friendsError', refused); });
  },

  // The next page, added to the end.
  more: (btn) => busy(btn, null, async () => {
    const { res, data: d } = await api('GET', '/me/friends?limit=50&cursor=' + encodeURIComponent(data.nextCursor));
    if (!res.ok) return;
    const fresh = d.friends.filter((f) => !shown.has(f.person.id));
    fresh.forEach((f) => shown.add(f.person.id));
    listEl.insertAdjacentHTML('beforeend', UI.friendRows(fresh));
    data.nextCursor = d.nextCursor;
    if (!d.nextCursor) btn.remove();
  })
});
</script>
</body>
</html>
