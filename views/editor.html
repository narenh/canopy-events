<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>__PAGE_TITLE__</title>
<meta name="theme-color" content="#03120c">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/events.css">
</head>
<!-- Making an event (/new, verified people) or editing one (/e/<id>/edit,
     hosts). The form is public/ui.js's editorForm, drawn like the event
     page; this sends it to POST or PATCH /api/v1/events, then the cover
     (PUT or DELETE .../cover, or PUT .../cover/background for one of the
     curated backgrounds), and shows what the API refuses next to the
     field it's about. -->
<body class="mesh-bg">
<!-- PAGE:HEADER -->
<main class="wrap">
  <!-- PAGE:BANNER -->
  <div id="main" class="stack"><!-- PAGE:MAIN --></div>
</main>
<!-- PAGE:FOOTER -->
<script type="application/json" id="pageData">__PAGE_DATA__</script>
<script src="/copy.js"></script>
<script src="/ui.js"></script>
<script src="/events.js"></script>
<script>
applyCopy();

const data = pageData();
const editing = !!data.event;
// A duplicate (/new?from=<id>): a new event, started from the API's draft
// of another (routes/pages.js). What the form starts from: the event, the
// draft, or nothing.
const draft = data.draft || null;
const prefill = data.event || draft;
const form = document.getElementById('eventForm');
const $ = (id) => document.getElementById(id);

// No autofill on any of the event's fields: a place isn't your home
// address, and a host's phone or link isn't yours. autocomplete="off" is
// only a hint (Chrome ignores it for fields it takes for addresses, and
// Safari guesses from labels), so each field also gets the password
// managers' own opt-outs (1Password, LastPass, Bitwarden, Dashlane), and
// fields added later (a new detail row) get the same as they appear.
// Radios keep their name (it groups them); nothing else has one.
function noAutofill(el){
  if (!el.matches || !el.matches('input, textarea, select')) return;
  if (['radio', 'checkbox', 'range', 'file', 'hidden'].includes(el.type)) return;
  el.setAttribute('autocomplete', 'off');
  el.setAttribute('data-1p-ignore', '');
  el.setAttribute('data-lpignore', 'true');
  el.setAttribute('data-bwignore', '');
  el.setAttribute('data-form-type', 'other');
  el.setAttribute('autocorrect', el.tagName === 'TEXTAREA' ? 'on' : 'off');
}
form.querySelectorAll('input, textarea, select').forEach(noAutofill);
new MutationObserver((changes) => changes.forEach((c) => c.addedNodes.forEach((n) => {
  if (n.nodeType !== 1) return;
  noAutofill(n);
  n.querySelectorAll && n.querySelectorAll('input, textarea, select').forEach(noAutofill);
}))).observe(form, { childList: true, subtree: true });

// The API's refusal, under the field it's about (and focus on it). The
// words are copy.js's for the reasons it knows, otherwise the API's own.
const FIELD_FOR = {
  bad_title: 'title', bad_description: 'description', bad_starts_at: 'startsAt', bad_ends_at: 'endsAt',
  ends_before_start: 'endsAt', bad_time_zone: 'timeZone', bad_location_name: 'location',
  bad_location_address: 'location', bad_coordinates: 'location', bad_apple_place_id: 'location', bad_guest_list_visibility: 'guestListVisibility',
  bad_guests_allowed: 'guestsAllowed', bad_capacity: 'capacity', bad_theme_hue: 'themeHue', bad_theme_grayscale: 'themeHue', bad_accent_hue: 'accentHue', accent_needs_grayscale: 'accentHue',
  bad_details: 'details', too_many_details: 'details', bad_cover_from: 'cover', no_cover: 'cover'
};
// What to focus for a field whose control has another id.
const FOCUS_FOR = { cover: 'coverFile', startsAt: 'startDate', timeZone: 'zoneBtn', guestListVisibility: null, details: null };
function showRefusal(d){
  const words = COPY.editor.errors[d.reason] || sentence(d.error);
  // About one of the details: under its row.
  if (showDetailRefusal(d, words)) return;
  const fieldId = FIELD_FOR[d.reason];
  const el = (fieldId && $(fieldId + 'Error')) || $('formError');
  el.textContent = words;
  const focusId = fieldId && (fieldId in FOCUS_FOR ? FOCUS_FOR[fieldId] : fieldId);
  // With the popover, the date or time's own button (the field's hidden).
  const input = focusId && (fine && picks[focusId] ? picks[focusId] : $(focusId));
  if (input && input.focus) input.focus();
}

function clearErrors(){
  form.querySelectorAll('.error').forEach((el) => { el.textContent = ''; });
}

// ---------------- The title ----------------
//
// Typed where the page shows it, as big, wrapping as it will there: one
// line of text that grows. A return doesn't start a new line.
const title = $('title');
function fitTitle(){
  title.style.height = 'auto';
  title.style.height = title.scrollHeight + 'px';
}
title.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.preventDefault(); });
title.addEventListener('input', () => {
  if (/\n/.test(title.value)) title.value = title.value.replace(/\s*\n\s*/g, ' ');
  fitTitle();
});
window.addEventListener('resize', fitTitle);
fitTitle();

// ---------------- When ----------------
//
// The day, the start and the end, each drawn big in the page's words with
// the browser's own picker under it. Moving the start moves the end with
// it (the same length), as calendars do. The times are read on the
// chosen zone's clock when the form is saved; changing the zone keeps
// the clock times.
const startDate = $('startDate');
const startTime = $('startTime');
const endsAt = $('endsAt');

function drawWhen(){
  const set = (id, words, placeholder) => {
    $(id + 'Text').textContent = words || placeholder;
    $(id + 'Pick').classList.toggle('empty', !words);
  };
  set('startDate', UI.dayWords(startDate.value), t('editor.datePlaceholder'));
  set('startTime', UI.clockWords(startTime.value), t('editor.startTime'));
  set('endsAt', UI.endWords(endsAt.value, startDate.value), t('editor.endTime'));
  const hasEnd = !!endsAt.value;
  $('endPart').hidden = !hasEnd;
  $('endAdd').hidden = hasEnd;
  labelPicks();
}

// The start as a wall-clock time in milliseconds (for moving the end),
// or null.
function startWall(){
  if (!startDate.value) return null;
  const [y, m, d] = startDate.value.split('-').map(Number);
  const [hh, mm] = (startTime.value || '00:00').split(':').map(Number);
  return Date.UTC(y, m - 1, d, hh, mm);
}
function wallValue(ms){
  return new Date(ms).toISOString().slice(0, 16);
}
let lastStart = startWall();

// A new event whose day is picked with no start time yet starts at 7 PM
// (on the event's clock, as every time here). A time someone chose stays,
// and an event being edited keeps its own. Runs before startMoved: the
// start had no time, which moving the end counts as midnight, so that's
// moved to 7 PM too and an end only moves by the days.
function fillStartTime(){
  const time = UI.startTimeFor(editing, startDate.value, startTime.value);
  if (time === startTime.value) return;
  startTime.value = time;
  const [hh, mm] = time.split(':').map(Number);
  if (lastStart != null) lastStart += (hh * 60 + mm) * 60000;
}
startDate.addEventListener('input', fillStartTime);
startDate.addEventListener('change', fillStartTime);

function startMoved(){
  const now = startWall();
  if (endsAt.value && lastStart != null && now != null && now !== lastStart){
    const end = Date.parse(endsAt.value + ':00Z');
    if (!isNaN(end)) endsAt.value = wallValue(end + (now - lastStart));
  }
  lastStart = now;
  drawWhen();
  drawZone();
}
startDate.addEventListener('input', startMoved);
startDate.addEventListener('change', startMoved);
startTime.addEventListener('input', startMoved);
startTime.addEventListener('change', startMoved);
endsAt.addEventListener('input', drawWhen);
endsAt.addEventListener('change', drawWhen);

// No showPicker() on click: a forced pop-up swallowed typing in Chrome
// and opened nothing for times in desktop Safari. A phone or a tablet
// opens its own wheel when the see-through field is tapped. With a mouse
// or trackpad, the date and times open the popover below instead.

// ---------------- The date and time popover ----------------
//
// With a mouse or trackpad (hover and a fine pointer, checked live), the
// date, the start and the end each open one popover under the when row:
// the month on the left (past days dimmed, unless the event already
// started in the past), the time on the right, typed (any minute: 7:57)
// or picked from every quarter hour. The native fields stay underneath,
// hidden, as the values: the popover writes them and fires input and
// change, so the 7 PM default, moving the end with the start, the words,
// saving and the time zone all work as with the browser's own pickers.
// Picking a day keeps it open; picking a time (or Enter in the time
// field) closes it. Phones and tablets keep the system's pickers.
const fineQuery = window.matchMedia ? window.matchMedia('(hover: hover) and (pointer: fine)') : null;
let fine = false;
const whenBox = form.querySelector('.when-edit');
const picks = { startDate: $('startDatePick'), startTime: $('startTimePick'), endsAt: $('endsAtPick') };
const PICK_LABEL = { startDate: 'editor.date', startTime: 'editor.startTime', endsAt: 'editor.endTime' };
// The popover's state: which ('start' or 'end'), what opened it, the
// month shown (its first day), the day that takes Tab, the day and time
// picked so far, and the time list's highlighted row.
const pop = { el: null, mode: null, opener: null, view: '', focus: '', day: '', time: '', active: -1 };

// Each piece, a button for the popover: "Date, Saturday, October 10".
function labelPicks(){
  Object.keys(picks).forEach((id) => {
    if (!fine){ picks[id].removeAttribute('aria-label'); return; }
    const words = picks[id].classList.contains('empty') ? '' : $(id + 'Text').textContent;
    picks[id].setAttribute('aria-label', t(PICK_LABEL[id]) + (words ? ', ' + words : ''));
  });
}

function setFine(on){
  fine = on;
  whenBox.classList.toggle('popover-picks', on);
  Object.keys(picks).forEach((id) => {
    const label = picks[id];
    if (on){
      label.setAttribute('tabindex', '0');
      label.setAttribute('role', 'button');
      label.setAttribute('aria-haspopup', 'dialog');
      label.setAttribute('aria-expanded', 'false');
      $(id).setAttribute('tabindex', '-1');
    } else {
      ['tabindex', 'role', 'aria-haspopup', 'aria-expanded'].forEach((a) => label.removeAttribute(a));
      $(id).removeAttribute('tabindex');
    }
  });
  if (!on) closeWhen(false);
  labelPicks();
}

// Today, on the event's clock.
function todayThere(){
  return UI.localInput(new Date().toISOString(), zoneInput.value).slice(0, 10);
}
// The first day that may be picked: today, or for the end, the start's
// day. An event that already started in the past (editing an old one)
// can be moved anywhere: its days aren't held back.
const startedInPast = editing && Date.parse(data.event.startsAt) < Date.now();
function minDay(){
  if (pop.mode === 'end' && startDate.value) return startDate.value;
  return startedInPast ? '' : todayThere();
}
function monthOf(date){
  return date.slice(0, 8) + '01';
}

function fire(input){
  input.dispatchEvent(new Event('input', { bubbles: true }));
  input.dispatchEvent(new Event('change', { bubbles: true }));
}
// Reads the picked day and time back from the fields (the start's day
// may have just filled in 7 PM).
function readPicked(){
  if (pop.mode === 'start'){
    pop.day = startDate.value;
    pop.time = startTime.value;
  } else if (endsAt.value){
    pop.day = endsAt.value.slice(0, 10);
    pop.time = endsAt.value.slice(11, 16);
  }
}
// Writes the day and time picked into the fields. An end needs both; a
// day or a time alone waits for the other.
function writePicked(){
  if (pop.mode === 'start'){
    if (pop.day && pop.day !== startDate.value){ startDate.value = pop.day; fire(startDate); }
    if (pop.time && pop.time !== startTime.value){ startTime.value = pop.time; fire(startTime); }
  } else if (pop.day && pop.time){
    const value = pop.day + 'T' + pop.time;
    if (value !== endsAt.value){ endsAt.value = value; fire(endsAt); }
  }
  readPicked();
}

function buildPop(){
  whenBox.insertAdjacentHTML('beforeend', UI.whenPopover());
  pop.el = $('whenPop');
  pop.el.querySelectorAll('input').forEach(noAutofill);
  const field = $('whenPopTime');
  const list = $('whenPopTimes');
  pop.el.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-wp]');
    if (nav){ moveMonth(nav.getAttribute('data-wp') === 'next' ? 1 : -1); return; }
    const day = e.target.closest('.wp-day');
    if (day){ pickDay(day.getAttribute('data-date')); return; }
    const opt = e.target.closest('.wp-opt');
    if (opt) pickTime(opt.getAttribute('data-time'));
  });
  $('whenPopGrid').addEventListener('keydown', (e) => {
    const next = UI.calendarMove(pop.focus, e.key, e.shiftKey);
    if (!next) return;
    e.preventDefault();
    pop.focus = next;
    pop.view = monthOf(next);
    drawMonth();
    focusDay();
  });
  field.addEventListener('focus', () => field.select());
  field.addEventListener('input', () => showTimeError(false));
  field.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){
      e.preventDefault();
      if (typedTime()) closeWhen(true);
    } else if (e.key === 'ArrowDown'){
      e.preventDefault();
      list.focus();
    }
  });
  // Leaving the field (a click elsewhere in the popover, or outside it)
  // takes what's typed, if it's a time.
  field.addEventListener('blur', () => { if (!pop.el.hidden) typedTime(); });
  list.addEventListener('focus', () => { if (pop.active < 0) setActive(selectedIndex()); });
  list.addEventListener('keydown', (e) => {
    const opts = options();
    if (!opts.length) return;
    let at = pop.active;
    if (e.key === 'ArrowDown') at = Math.min(at + 1, opts.length - 1);
    else if (e.key === 'ArrowUp') at = Math.max(at - 1, 0);
    else if (e.key === 'Home') at = 0;
    else if (e.key === 'End') at = opts.length - 1;
    else if (e.key === 'PageDown') at = Math.min(at + 8, opts.length - 1);
    else if (e.key === 'PageUp') at = Math.max(at - 8, 0);
    else if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      if (opts[at]) pickTime(opts[at].getAttribute('data-time'));
      return;
    } else return;
    e.preventDefault();
    setActive(at);
  });
}

function options(){
  return Array.from($('whenPopTimes').querySelectorAll('.wp-opt'));
}
function selectedIndex(){
  const opts = options();
  const on = opts.findIndex((o) => o.getAttribute('aria-selected') === 'true');
  if (on >= 0) return on;
  // Nothing picked: the time it would most likely be.
  const near = nearTime();
  return Math.max(0, opts.findIndex((o) => o.getAttribute('data-time') >= near));
}
function setActive(i){
  const opts = options();
  opts.forEach((o, j) => o.classList.toggle('active', j === i));
  pop.active = i;
  const list = $('whenPopTimes');
  if (opts[i]){
    list.setAttribute('aria-activedescendant', opts[i].id);
    const top = opts[i].offsetTop;
    if (top < list.scrollTop) list.scrollTop = top;
    else if (top + opts[i].offsetHeight > list.scrollTop + list.clientHeight) list.scrollTop = top + opts[i].offsetHeight - list.clientHeight;
  } else list.removeAttribute('aria-activedescendant');
}
// The time a bare "7:57" is read near: the one it replaces, or for an
// end with none, three hours after the start, or 7 PM.
function nearTime(){
  if (pop.time) return pop.time;
  if (pop.mode === 'end' && startTime.value){
    const [hh, mm] = startTime.value.split(':').map(Number);
    const m = (hh * 60 + mm + 180) % 1440;
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }
  return UI.DEFAULT_START;
}

function drawMonth(){
  const [y, m] = pop.view.split('-').map(Number);
  $('whenPopMonth').textContent = UI.monthWords(y, m);
  // The day that takes Tab is in the month shown.
  if (!pop.focus || monthOf(pop.focus) !== pop.view){
    const today = todayThere();
    pop.focus = pop.day && monthOf(pop.day) === pop.view ? pop.day : (monthOf(today) === pop.view ? today : pop.view);
  }
  $('whenPopGrid').innerHTML = UI.calendarMonth(y, m, { selected: pop.day, today: todayThere(), min: minDay(), focus: pop.focus });
}
function focusDay(){
  const b = $('whenPopGrid').querySelector('[data-date="' + pop.focus + '"]');
  if (b) b.focus();
}
function drawTimes(){
  $('whenPopTimes').innerHTML = UI.timeOptions(pop.time);
  pop.active = -1;
  $('whenPopTimes').removeAttribute('aria-activedescendant');
  // The time picked (or the likeliest), in the middle of the list.
  const opts = options();
  const at = opts[selectedIndex()];
  const list = $('whenPopTimes');
  if (at) list.scrollTop = at.offsetTop - (list.clientHeight - at.offsetHeight) / 2;
}
function drawTop(){
  $('whenPopChosen').textContent = UI.pickedWords(pop.day, pop.time);
  if (document.activeElement !== $('whenPopTime')) $('whenPopTime').value = UI.clockWords(pop.time);
}

function moveMonth(n){
  pop.view = UI.addMonths(pop.view, n);
  pop.focus = UI.addMonths(pop.focus || pop.view, n);
  drawMonth();
}

function pickDay(date){
  const b = $('whenPopGrid').querySelector('[data-date="' + date + '"]');
  if (!b || b.getAttribute('aria-disabled') === 'true') return;
  pop.day = date;
  pop.focus = date;
  if (monthOf(date) !== pop.view) pop.view = monthOf(date);
  const hadTime = pop.time;
  writePicked();
  drawMonth();
  focusDay();
  drawTop();
  if (pop.time !== hadTime) drawTimes();
}

function pickTime(time){
  showTimeError(false);
  pop.time = time;
  writePicked();
  closeWhen(true);
}

function showTimeError(on){
  $('whenPopTimeError').textContent = on ? t('editor.pickerBadTime') : '';
  if (on) $('whenPopTime').setAttribute('aria-invalid', 'true');
  else $('whenPopTime').removeAttribute('aria-invalid');
}
// What's typed in the time field, taken: true when it's a time (or
// nothing new), false with the error shown when it isn't.
function typedTime(){
  const field = $('whenPopTime');
  const text = field.value.trim();
  if (!text || text === UI.clockWords(pop.time)){ showTimeError(false); return true; }
  const time = UI.parseClock(text, nearTime());
  if (!time){ showTimeError(true); return false; }
  showTimeError(false);
  pop.time = time;
  writePicked();
  field.value = UI.clockWords(pop.time);
  drawTop();
  drawTimes();
  return true;
}

function placePop(){
  // Under the start and end times, from the row's left edge.
  const row = whenBox.querySelector('.when-time');
  pop.el.style.top = (row.offsetTop + row.offsetHeight + 10) + 'px';
}

function openWhen(mode, opener, part){
  if (!pop.el) buildPop();
  if (!pop.el.hidden) closeWhen(false);
  pop.mode = mode;
  pop.opener = opener;
  pop.day = mode === 'start' ? startDate.value : (startDate.value || '');
  pop.time = '';
  readPicked();
  pop.focus = '';
  pop.view = monthOf(pop.day || (mode === 'end' && startDate.value) || todayThere());
  pop.el.setAttribute('aria-label', t(mode === 'start' ? 'editor.pickerStart' : 'editor.pickerEnd'));
  $('whenPopKind').textContent = t(mode === 'start' ? 'editor.pickerStarts' : 'editor.pickerEnds');
  showTimeError(false);
  $('whenPopTime').value = '';
  pop.el.hidden = false;
  placePop();
  form.classList.add('menu-open');
  opener.setAttribute('aria-expanded', 'true');
  drawMonth();
  drawTop();
  drawTimes();
  pop.el.scrollIntoView({ block: 'nearest' });
  if (part === 'time') $('whenPopTime').focus({ preventScroll: true });
  else {
    const b = $('whenPopGrid').querySelector('[data-date="' + pop.focus + '"]');
    if (b) b.focus({ preventScroll: true });
  }
}

function closeWhen(returnFocus){
  if (!pop.el || pop.el.hidden) return;
  pop.el.hidden = true;
  form.classList.remove('menu-open');
  if (pop.opener){
    pop.opener.setAttribute('aria-expanded', 'false');
    if (returnFocus) pop.opener.focus();
  }
}

// A click on the date or a time opens the popover (on the same one
// again, shuts it); Enter, Space or the down arrow on it, too.
function pickOpened(label){
  const id = label.id.replace(/Pick$/, '');
  const mode = id === 'endsAt' ? 'end' : 'start';
  if (pop.el && !pop.el.hidden && pop.opener === label){ closeWhen(false); return; }
  openWhen(mode, label, id === 'startDate' ? 'day' : 'time');
}
whenBox.addEventListener('click', (e) => {
  if (!fine) return;
  const label = e.target.closest('.pick');
  if (!label || !whenBox.contains(label)) return;
  e.preventDefault();
  pickOpened(label);
});
whenBox.addEventListener('keydown', (e) => {
  if (!fine || !e.target.classList.contains('pick')) return;
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown'){
    e.preventDefault();
    pickOpened(e.target);
  }
});
// A click anywhere else shuts it.
document.addEventListener('click', (e) => {
  if (!pop.el || pop.el.hidden) return;
  if (e.target.closest('#whenPop') || (e.target.closest('.pick') && whenBox.contains(e.target))) return;
  closeWhen(false);
}, true);
// Escape shuts it and goes back to what opened it; Tab stays inside.
document.addEventListener('keydown', (e) => {
  if (!pop.el || pop.el.hidden) return;
  if (e.key === 'Escape'){ e.preventDefault(); closeWhen(true); return; }
  if (e.key !== 'Tab') return;
  const inside = [pop.el.querySelector('[data-wp="prev"]'), pop.el.querySelector('[data-wp="next"]'),
    $('whenPopGrid').querySelector('[tabindex="0"]'), $('whenPopTime'), $('whenPopTimes')].filter(Boolean);
  const i = inside.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0){ e.preventDefault(); inside[inside.length - 1].focus(); }
  else if (!e.shiftKey && i === inside.length - 1){ e.preventDefault(); inside[0].focus(); }
});

if (fineQuery){
  setFine(fineQuery.matches);
  const onChange = (e) => setFine(e.matches);
  if (fineQuery.addEventListener) fineQuery.addEventListener('change', onChange);
  else if (fineQuery.addListener) fineQuery.addListener(onChange);
}

onActions({
  // A new end: three hours after the start (or none yet, with no start),
  // then the picker to change it (the popover, with a mouse or trackpad).
  'add-end': () => {
    const s = startWall();
    if (s != null && startTime.value) endsAt.value = wallValue(s + 3 * 3600e3);
    drawWhen();
    if (fine) openWhen('end', picks.endsAt, 'time');
    else endsAt.focus();
  },
  'clear-end': () => {
    endsAt.value = '';
    drawWhen();
    $('endAdd').focus();
  }
});

// ---------------- The time zone ----------------
//
// Its friendly name, small under the time, with "Change": a menu of the
// zones near this browser's own (at the event's date, so summer time is
// right), then "Other time zones…", a search of every zone. A new event
// starts in this browser's zone.
const zoneInput = $('timeZone');
const zoneBtn = $('zoneBtn');
const zoneMenu = $('zoneMenu');
const zonePanel = $('zonePanel');
const zoneSearch = $('zoneSearch');
const zoneList = $('zoneList');
const here = viewerZone();
if (!prefill && here) zoneInput.value = here;

// When the zones are worked out for: the start, read on that clock, or now.
function zoneMoment(){
  const at = startDate.value ? Date.parse(UI.fromLocalInput(startDate.value + 'T' + (startTime.value || '12:00'), zoneInput.value)) : NaN;
  return isNaN(at) ? Date.now() : at;
}
function drawZone(){
  $('zoneName').textContent = UI.zoneName(zoneInput.value, zoneMoment());
}
drawZone();

function setZone(zone){
  zoneInput.value = zone;
  $('timeZoneError').textContent = '';
  drawZone();
}

function closeZoneMenu(focusButton){
  if (zoneMenu.hidden) return;
  zoneMenu.hidden = true;
  form.classList.remove('menu-open');

// Keys: the menu as the host's ⋯ menu (arrows, Home, End, Escape, Tab);
// the search's list with the arrows, Enter on the search taking the first
// match, and Escape closing it.
document.addEventListener('keydown', (e) => {
  if (!zoneMenu.hidden){
    const items = Array.from(zoneMenu.querySelectorAll('[role^=menuitem]'));
    const at = items.indexOf(document.activeElement);
    if (e.key === 'Escape'){ e.preventDefault(); closeZoneMenu(true); }
    else if (e.key === 'ArrowDown'){ e.preventDefault(); items[(at + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); items[(at - 1 + items.length) % items.length].focus(); }
    else if (e.key === 'Home'){ e.preventDefault(); items[0].focus(); }
    else if (e.key === 'End'){ e.preventDefault(); items[items.length - 1].focus(); }
    else if (e.key === 'Tab') closeZoneMenu(false);
    return;
  }
  if (!zonePanel.hidden){
    const rows = Array.from(zoneList.querySelectorAll('.zone-row'));
    const at = rows.indexOf(document.activeElement);
    if (e.key === 'Escape'){ e.preventDefault(); closeZonePanel(true); }
    else if (e.key === 'Enter' && document.activeElement === zoneSearch){ e.preventDefault(); if (rows[0]) rows[0].click(); }
    else if (e.key === 'ArrowDown'){ e.preventDefault(); if (rows.length) rows[Math.min(at + 1, rows.length - 1)].focus(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); if (at <= 0) zoneSearch.focus(); else rows[at - 1].focus(); }
    else if (e.key === 'Tab'){
      // Kept inside the search while it's open.
      const inside = Array.from(zonePanel.querySelectorAll('input, button'));
      const i = inside.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0){ e.preventDefault(); inside[inside.length - 1].focus(); }
      else if (!e.shiftKey && i === inside.length - 1){ e.preventDefault(); inside[0].focus(); }
    }
  }
});

// ---------------- The cover ----------------
//
// The hero is the cover. Picking a photo or removing the cover only
// changes it here; it's sent when the form is saved, after the event
// itself (a new event needs its id first). The server re-encodes
// whatever it gets (turned the right way up, shrunk, no location), so
// the photo goes as it is. With no photo, the hero is the generated
// picture, in the event's colour.
const MAX_COVER = 15 * 1024 * 1024;
const coverFile = $('coverFile');
const coverPreview = $('coverPreview');
const head = $('details');
// null: as it was; a File: upload it; { background }: one of the curated
// backgrounds; 'remove'.
let coverChange = null;
let previewUrl = null;
const hadCover = editing && !!UI.coverUrl(data.event);
// A duplicate shows the original's cover, and Save asks the server for a
// copy of it (POST /events coverFrom), until the host takes it off or
// picks another.
let coverFrom = draft && draft.coverFrom ? draft.coverFrom : null;

// The words for a cover refusal, by its reason. A 413 may come from a
// proxy in front, with no JSON.
function coverReason(d, status){
  return status === 413 ? 'too_large' : (d && d.reason) || 'failed';
}
function coverWords(reason, d){
  return COPY.editor.coverErrors[reason] || sentence(d && d.error);
}

function drawCover(src){
  if (previewUrl && previewUrl !== src){ URL.revokeObjectURL(previewUrl); previewUrl = null; }
  $('coverNoPreview').classList.add('hidden');
  // The saved cover's sizes (public/ui.js coverImg) would win over a new
  // src: once the host picks or removes a photo, they're not it.
  coverPreview.removeAttribute('srcset');
  coverPreview.removeAttribute('sizes');
  if (src) coverPreview.src = src;
  else coverPreview.removeAttribute('src');
  head.classList.toggle('has-cover', !!src);
  $('coverRemove').hidden = !src;
  const words = t(src ? 'editor.coverChange' : 'editor.coverAdd');
  coverFile.setAttribute('aria-label', words);
  coverFile.parentNode.setAttribute('title', words);
}

// A photo the browser can't draw (HEIC, outside Safari) still uploads:
// the server turns it into a JPEG. Say so instead of a broken image.
coverPreview.addEventListener('error', () => {
  if (!coverPreview.getAttribute('src')) return;
  head.classList.remove('has-cover');
  $('coverNoPreview').classList.remove('hidden');
});

coverFile.addEventListener('change', () => {
  $('coverError').textContent = '';
  const file = coverFile.files && coverFile.files[0];
  if (!file) return;
  if (file.size > MAX_COVER){
    $('coverError').textContent = COPY.editor.coverErrors.too_large;
    coverFile.value = '';
    return;
  }
  coverChange = file;
  coverFrom = null;
  previewUrl = URL.createObjectURL(file);
  drawCover(previewUrl);
  markBackground(null);
  photoKey = null;
  matchPicked(previewUrl);
});

onActions({
  'remove-cover': () => {
    $('coverError').textContent = '';
    coverFile.value = '';
    coverChange = hadCover ? 'remove' : null;
    coverFrom = null;
    drawCover(null);
    markBackground(null);
    forgetPhotoMatch();
    coverFile.focus();
  }
});

// ---------------- Backgrounds ----------------
//
// The curated backgrounds (from TMDB), when there are any: the second
// button on the photo opens a sheet of them. Picking one shows it as the
// hero at once (TMDB's own 780 px copy), jumps the colour slider to the
// hue the server worked out for it, and on Save makes it the cover (PUT
// .../cover/background), exactly as a picked photo is uploaded.
const backgroundList = data.backgrounds || [];
const backgroundPanel = $('backgroundPanel');
const backgroundOpen = $('backgroundOpen');

// The chosen one ticked in the sheet (none: null).
function markBackground(id){
  if (!backgroundPanel) return;
  backgroundPanel.querySelectorAll('.bg-pick').forEach((b) => b.setAttribute('aria-pressed', b.getAttribute('data-id') === id ? 'true' : 'false'));
}

function openBackgrounds(){
  $('backgroundBackdrop').hidden = false;
  backgroundPanel.hidden = false;
  form.classList.add('menu-open');
  document.body.classList.add('sheet-open');
  backgroundOpen.setAttribute('aria-expanded', 'true');
  const on = backgroundPanel.querySelector('.bg-pick[aria-pressed="true"]') || backgroundPanel.querySelector('.bg-pick');
  if (on){ on.focus({ preventScroll: true }); on.scrollIntoView({ block: 'nearest' }); }
}
function closeBackgrounds(){
  if (!backgroundPanel || backgroundPanel.hidden) return;
  backgroundPanel.hidden = true;
  $('backgroundBackdrop').hidden = true;
  form.classList.remove('menu-open');
  document.body.classList.remove('sheet-open');
  backgroundOpen.setAttribute('aria-expanded', 'false');
  backgroundOpen.focus();
}

function pickBackground(id){
  const b = backgroundList.find((x) => x.id === id);
  if (!b) return;
  $('coverError').textContent = '';
  coverFile.value = '';
  coverChange = { background: b };
  coverFrom = null;
  drawCover(b.previewUrl || b.thumbUrl);
  markBackground(b.id);
  photoKey = b.grayscale ? 'grey' : (UI.isHue(b.hue) ? b.hue : null);
  if (photoKey !== null) setTheme(photoKey);
  else showTheme();
  closeBackgrounds();
}

if (backgroundPanel){
  onActions({
    'open-backgrounds': openBackgrounds,
    'close-backgrounds': closeBackgrounds,
    'pick-background': (el) => pickBackground(el.getAttribute('data-id'))
  });
  $('backgroundBackdrop').addEventListener('click', closeBackgrounds);
  // Escape closes it; Tab stays inside while it's open.
  document.addEventListener('keydown', (e) => {
    if (backgroundPanel.hidden) return;
    if (e.key === 'Escape'){ e.preventDefault(); closeBackgrounds(); return; }
    if (e.key !== 'Tab') return;
    const inside = Array.from(backgroundPanel.querySelectorAll('button'));
    const i = inside.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0){ e.preventDefault(); inside[inside.length - 1].focus(); }
    else if (!e.shiftKey && i === inside.length - 1){ e.preventDefault(); inside[0].focus(); }
  });
}

// Sends the cover change, if there is one, for the event `id`. Answers
// null when it worked (or there was nothing to send), or the refusal's
// { reason, words }.
async function saveCover(id){
  if (!coverChange) return null;
  const path = '/events/' + encodeURIComponent(id) + '/cover';
  let answer;
  if (coverChange === 'remove') answer = await api('DELETE', path);
  else if (coverChange.background) answer = await api('PUT', path + '/background', { backgroundId: coverChange.background.id });
  else {
    const body = new FormData();
    body.append('cover', coverChange, coverChange.name || 'cover');
    answer = await api('PUT', path, body);
  }
  if (answer.res.ok){ coverChange = null; return null; }
  const reason = coverReason(answer.data, answer.res.status);
  return { reason, words: coverWords(reason, answer.data) };
}

// ---------------- The colour ----------------
//
// The slider runs from grey (no colour) round the wheel, and dragging it
// turns this page's own background (and the generated picture) as it
// moves, so the host sees the event's page while choosing. Untouched, a
// new event stays Canopy green (null). "Match photo" sets it to the
// photo's colour (or grey, for a grey photo): the stored cover's
// coverHue, or, for a photo just picked, the same hueFromPixels the
// server runs, on the preview. Picking a photo jumps the slider there.
// Nothing is saved until Save.
//
// While the colour is grey, a second slider, Accent, picks the buttons',
// pill's and ring's colour: white, then round the wheel. It's hidden
// otherwise, and leaving grey sends accentHue null (the server clears it
// then anyway). "Match photo" only moves the colour.
const hueInput = $('themeHue');
const accentInput = $('accentHue');
let themeKey = prefill ? UI.themeKeyOf(prefill) : null;
let accentKey = (prefill && UI.accentKeyOf(prefill)) || UI.WHITE;
// The colour that matches the photo now shown: a theme key, or null for
// none known.
let photoKey = !prefill ? null : (prefill.coverGrayscale ? 'grey' : (UI.isHue(prefill.coverHue) ? prefill.coverHue : null));

function showTheme(){
  const style = UI.themeStyle(themeKey, accentKey);
  if (style) document.documentElement.setAttribute('style', style);
  else document.documentElement.removeAttribute('style');
  const meta = document.querySelector('meta[name="theme-color"]');
  const c = UI.themeColors(themeKey);
  if (meta) meta.setAttribute('content', c ? '#' + c.base.map((x) => x.toString(16).padStart(2, '0')).join('') : '#03120c');
  hueInput.setAttribute('aria-valuetext', UI.themeWords(themeKey));
  $('accentField').hidden = themeKey !== 'grey';
  accentInput.setAttribute('aria-valuetext', UI.accentWords(accentKey));
  $('themeMatch').hidden = photoKey === null;
  // The generated picture, in the same colour.
  $('coverArt').setAttribute('style', UI.coverArtStyle(Object.assign({ id: editing ? data.event.id : '' }, themeFields())));
}

function setTheme(key){
  themeKey = key;
  hueInput.value = String(UI.sliderOf(key));
  showTheme();
}

hueInput.addEventListener('input', () => {
  themeKey = UI.keyOfSlider(hueInput.value);
  showTheme();
});

accentInput.addEventListener('input', () => {
  accentKey = UI.accentOfSlider(accentInput.value);
  showTheme();
});

// The colour of a photo the browser can draw: shrunk to 64×64 on a
// canvas, then the server's own hueFromPixels. A photo it can't draw
// (HEIC, outside Safari) gets no suggestion here; the server still works
// one out on Save, for next time.
function matchPicked(url){
  const img = new Image();
  img.onload = () => {
    try{
      const scale = 64 / Math.max(img.naturalWidth, img.naturalHeight);
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const g = canvas.getContext('2d');
      g.drawImage(img, 0, 0, w, h);
      const hue = UI.hueFromPixels(g.getImageData(0, 0, w, h).data, 4);
      photoKey = hue === null ? 'grey' : hue;
      setTheme(photoKey);
    }catch(e){}
  };
  img.src = url;
}

function forgetPhotoMatch(){
  photoKey = null;
  showTheme();
}

onActions({
  'theme-match': () => { if (photoKey !== null) setTheme(photoKey); }
});

// What Save sends: grey (with its accent: a hue, or null for white), a
// hue, or Canopy green.
function themeFields(){
  if (themeKey === 'grey') return { themeGrayscale: true, themeHue: null, accentHue: UI.isHue(accentKey) ? accentKey : null };
  return { themeGrayscale: false, themeHue: UI.isHue(themeKey) ? themeKey : null, accentHue: null };
}

// ---------------- The details ----------------
//
// Under the description: a chip per type adds a row for it (public/ui.js
// detailEditRow) at the end, and its × takes it off. Save sends every
// row with something in it, in order (an untouched new row is left out),
// replacing the list there was. A refusal about one says which (`index`
// in the API's answer), and shows under that row.
const detailRows = $('detailRows');
const DETAIL_MAX = 10;

function rowsShown(){
  return Array.from(detailRows.querySelectorAll('.detail-edit'));
}
function drawDetailChips(){
  const full = rowsShown().length >= DETAIL_MAX;
  $('detailChips').querySelectorAll('[data-action="add-detail"]').forEach((b) => { b.disabled = full; });
}

onActions({
  'add-detail': (el) => {
    if (rowsShown().length >= DETAIL_MAX) return;
    detailRows.insertAdjacentHTML('beforeend', UI.detailEditRow({ type: el.getAttribute('data-type') }));
    drawDetailChips();
    const rows = rowsShown();
    const row = rows[rows.length - 1];
    // A link's address and a phone's number first; the rest, the text.
    row.querySelector('.detail-value').focus();
  },
  'remove-detail': (el) => {
    const row = el.closest('.detail-edit');
    const next = row.nextElementSibling || row.previousElementSibling;
    row.remove();
    drawDetailChips();
    // Focus somewhere sensible: the next row's ×, or the first chip.
    const target = next ? next.querySelector('[data-action="remove-detail"]') : $('detailChips').querySelector('button');
    if (target) target.focus();
  }
});

// A link's text field previews what the page shows without one: its
// placeholder follows the address as it's typed.
detailRows.addEventListener('input', (e) => {
  const row = e.target.closest('.detail-edit[data-type="link"]');
  if (row && e.target.classList.contains('detail-value')) {
    row.querySelector('.detail-label').setAttribute('placeholder', UI.linkTextPlaceholder(e.target.value));
  }
});

// The rows that go: [{ row, detail }], in order. A row with nothing typed
// in it isn't sent. A phone's row has no label field; a label it came
// with goes back as it was.
let detailsSent = [];
function detailsToSend(){
  detailsSent = rowsShown().map((row) => {
    const labelField = row.querySelector('.detail-label');
    return {
      row,
      detail: {
        type: row.getAttribute('data-type'),
        label: (labelField ? labelField.value.trim() : row.getAttribute('data-label')) || null,
        value: row.querySelector('.detail-value').value
      }
    };
  }).filter((x) => x.detail.value.trim() || (x.detail.label && x.row.querySelector('.detail-label')));
  return detailsSent.map((x) => x.detail);
}

// A refusal about one detail, under its row. True when it was one.
function showDetailRefusal(d, words){
  if (!d || typeof d.index !== 'number' || !detailsSent[d.index]) return false;
  const row = detailsSent[d.index].row;
  row.querySelector('.detail-error').textContent = words;
  const labelField = row.querySelector('.detail-label');
  const input = d.reason === 'detail_too_long' && labelField && labelField.value.length > 60
    ? labelField : row.querySelector('.detail-value');
  input.focus();
  return true;
}

// A new event whose cover didn't upload lands here, to try again.
if (data.coverError){
  $('coverError').textContent = t('editor.coverNotSaved') + ' ' + (COPY.editor.coverErrors[data.coverError] || t('common.failed'));
}

// ---------------- Where ----------------
//
// One field, a place or an address (public/ui.js locationField). With
// places on, typing 2 or more characters opens suggestions: first, always,
// Use "<what's typed>", then Apple Maps' (GET /api/v1/places/autocomplete,
// a moment after typing stops). Picking one of Apple's asks for the whole
// place (GET /api/v1/places/{id}) and puts its name in the field and its
// address under it, with a × to clear; what's saved is in the hidden
// fields. Typing again goes back to typed text: the pick is let go. Typed
// text (picked with Use "…", or just left) is saved as the address only,
// private (UI.locationFromText). Places off, or Apple unreachable: no
// suggestions, and the field is typed text.
//
// It starts as the event has it (`kept`): saving without touching it
// sends what was there.
const loc = $('location');
const locList = $('locationList');
const locPicked = $('locationPicked');
const LOC_FIELDS = { locationName: $('locationName'), locationAddress: $('locationAddress'), latitude: $('latitude'), longitude: $('longitude'), applePlaceId: $('applePlaceId') };
let locMode = 'kept';
let locResults = [];
let locActive = -1;
let locSeq = 0;
let locTimer = null;

function setLocFields(v){
  Object.keys(LOC_FIELDS).forEach((k) => { LOC_FIELDS[k].value = v[k] == null ? '' : String(v[k]); });
}
// What the field saves as.
function locationToSend(){
  if (locMode === 'typed') return UI.locationFromText(loc.value);
  const f = LOC_FIELDS;
  const num = (el) => (el.value === '' ? null : Number(el.value));
  return {
    locationName: f.locationName.value || null,
    locationAddress: f.locationAddress.value || null,
    latitude: num(f.latitude),
    longitude: num(f.longitude),
    applePlaceId: f.applePlaceId.value || null
  };
}
function showPicked(line){
  $('locationLine').textContent = line || '';
  locPicked.hidden = !line;
}
function toTyped(){
  if (locMode === 'typed') return;
  locMode = 'typed';
  setLocFields({});
  showPicked('');
}
function closeLocList(){
  if (!locList) return;
  if (!locList.hidden) form.classList.remove('menu-open');
  locList.hidden = true;
  locList.innerHTML = '';
  loc.setAttribute('aria-expanded', 'false');
  loc.removeAttribute('aria-activedescendant');
  locActive = -1;
}
function locOptions(){
  return locList ? Array.from(locList.querySelectorAll('[role=option]')) : [];
}
function setLocActive(i){
  const opts = locOptions();
  locActive = opts.length ? Math.max(-1, Math.min(i, opts.length - 1)) : -1;
  opts.forEach((o, n) => o.setAttribute('aria-selected', n === locActive ? 'true' : 'false'));
  if (locActive >= 0){
    loc.setAttribute('aria-activedescendant', opts[locActive].id);
    opts[locActive].scrollIntoView({ block: 'nearest' });
  } else loc.removeAttribute('aria-activedescendant');
}
function drawLocList(){
  if (!locList) return;
  const q = loc.value.trim();
  if (locMode !== 'typed' || q.length < 2){ closeLocList(); return; }
  locList.innerHTML = UI.placeOptions(q, locResults, locActive);
  locList.hidden = false;
  // The Save bar drops beneath the list, as under the zone menu.
  form.classList.add('menu-open');
  loc.setAttribute('aria-expanded', 'true');
  setLocActive(locActive);
}
async function fetchPlaces(){
  const q = loc.value.trim();
  const seq = ++locSeq;
  let results = [];
  try{
    const { res, data: d } = await api('GET', '/places/autocomplete?q=' + encodeURIComponent(q), undefined, { stay: true });
    if (res.ok && d && Array.isArray(d.results)) results = d.results;
  }catch(e){}
  // Only the answer to what's in the field now.
  if (seq !== locSeq || locMode !== 'typed' || loc.value.trim() !== q) return;
  locResults = results;
  if (document.activeElement === loc) drawLocList();
}
async function pickLoc(i){
  if (i === 0){
    // Use "…": the text as it is.
    closeLocList();
    return;
  }
  const r = locResults[i - 1];
  if (!r) return;
  closeLocList();
  locMode = 'picked';
  loc.value = r.name;
  showPicked(r.address);
  // What's known so far, in case the whole place can't be had: the name
  // (for a named place) and the address, with no pin.
  setLocFields(UI.locationFromPlace({ name: r.name, address: r.kind === 'address' ? [r.name, r.address].filter(Boolean).join(', ') : r.address, kind: r.kind }));
  const seq = ++locSeq;
  try{
    const { res, data: d } = await api('GET', '/places/' + encodeURIComponent(r.id), undefined, { stay: true });
    if (seq !== locSeq || locMode !== 'picked' || !res.ok || !d.place) return;
    const place = d.place;
    setLocFields(UI.locationFromPlace(place));
    showPicked(place.address);
  }catch(e){}
}

if (UI.locationStart(prefill).line) locPicked.hidden = false;
loc.addEventListener('input', () => {
  toTyped();
  // The last suggestions stay until the next ones come (no flicker
  // between keys); none under 2 characters.
  if (loc.value.trim().length < 2) locResults = [];
  locActive = -1;
  drawLocList();
  clearTimeout(locTimer);
  if (locList && loc.value.trim().length >= 2) locTimer = setTimeout(fetchPlaces, 200);
});
loc.addEventListener('keydown', (e) => {
  const open = locList && !locList.hidden;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if (!open){
      if (locList && locMode === 'typed' && loc.value.trim().length >= 2){ drawLocList(); e.preventDefault(); }
      return;
    }
    e.preventDefault();
    const n = locOptions().length;
    setLocActive(e.key === 'ArrowDown' ? (locActive + 1) % n : (locActive <= 0 ? n - 1 : locActive - 1));
  } else if (e.key === 'Enter' && open){
    // Picks the highlighted row (Use "…" when none is), rather than
    // saving the form.
    e.preventDefault();
    pickLoc(Math.max(0, locActive));
  } else if (e.key === 'Escape' && open){
    e.preventDefault();
    closeLocList();
  }
});
loc.addEventListener('blur', () => { setTimeout(() => { if (document.activeElement !== loc) closeLocList(); }, 150); });
if (locList){
  // A tap or click on a row picks it, and the field keeps its focus (and
  // a phone its keyboard) until then.
  locList.addEventListener('pointerdown', (e) => e.preventDefault());
  locList.addEventListener('mousedown', (e) => e.preventDefault());
  locList.addEventListener('click', (e) => {
    const opt = e.target.closest('[role=option]');
    if (opt) pickLoc(Number(opt.getAttribute('data-index')));
  });
}
$('locationClear').addEventListener('click', () => {
  locMode = 'typed';
  loc.value = '';
  setLocFields({});
  showPicked('');
  closeLocList();
  loc.focus();
});

// ---------------- Saving ----------------

form.addEventListener('submit', (e) => {
  e.preventDefault();
  clearErrors();
  const zone = zoneInput.value;
  const ends = UI.fromLocalInput(endsAt.value, zone);
  const capacity = $('capacity');
  // Letters in a number field read as empty; say so rather than send
  // "no limit".
  if (capacity.validity && capacity.validity.badInput){
    showRefusal({ reason: 'bad_capacity' });
    return;
  }
  const body = {
    title: title.value.replace(/\s*\n\s*/g, ' '),
    description: $('description').value,
    // A day with no time, or a time with no day, isn't a start: the API
    // says so, under the date.
    startsAt: startDate.value && startTime.value ? UI.fromLocalInput(startDate.value + 'T' + startTime.value, zone) : '',
    timeZone: zone,
    ...locationToSend(),
    guestListVisibility: (form.querySelector('input[name=guestListVisibility]:checked') || {}).value,
    guestsAllowed: Number($('guestsAllowed').value),
    // Empty is no limit. Anything else goes as typed; the API says if
    // it isn't a whole number in range.
    capacity: capacity.value.trim() === '' ? null : Number(capacity.value),
    ...themeFields(),
    details: detailsToSend()
  };
  // An empty end: none (and, editing, clear the one there was).
  if (ends) body.endsAt = ends;
  else if (editing) body.endsAt = null;
  if (coverFrom) body.coverFrom = coverFrom;
  busy($('saveBtn'), $('formError'), async () => {
    const { res, data: d } = editing
      ? await api('PATCH', '/events/' + encodeURIComponent(data.event.id), body)
      : await api('POST', '/events', body);
    if (!res.ok){ showRefusal(d); return; }
    const id = d.event.id;
    const refused = await saveCover(id);
    if (refused){
      // The event is saved either way. A new one goes to its own editor
      // to try the cover again; an edit stays here, saying so.
      if (!editing){
        window.location.href = '/e/' + encodeURIComponent(id) + '/edit?coverError=' + encodeURIComponent(refused.reason);
        return;
      }
      $('coverError').textContent = t('editor.coverNotSaved') + ' ' + refused.words;
      return;
    }
    // A duplicate of an event that had the host's lists on it opens with
    // Lists… showing, to put them on again: they're never copied, since
    // attaching one invites everyone on it.
    const lists = !editing && draft && draft.lists && draft.lists.length;
    window.location.href = '/e/' + encodeURIComponent(id) + (lists ? '?lists=1' : '');
  });
});
</script>
</body>
