<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>__PAGE_TITLE__</title>
<meta name="theme-color" content="#03120c">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/events.css">
</head>
<!-- Inviting friends to an event (/e/<id>/invite, hosts only): your
     friends (GET /api/v1/me/friends), the ones already on the list marked
     with what they said, a search box, and POST .../invites. Drawn by
     public/ui.js (invitePage), which also marks where finding people by
     phone number or Instagram goes later. -->
<body class="mesh-bg">
<!-- PAGE:HEADER -->
<main class="wrap">
  <!-- PAGE:BANNER -->
  <div id="main" class="stack"><!-- PAGE:MAIN --></div>
</main>
<!-- PAGE:FOOTER -->
<script type="application/json" id="pageData">__PAGE_DATA__</script>
<script src="/copy.js"></script>
<script src="/ui.js"></script>
<script src="/events.js"></script>
<script>
applyCopy();

const data = pageData();
const list = document.getElementById('pickList');
const search = document.getElementById('search');
const sendBtn = document.getElementById('sendBtn');

function checkedIds(){
  return list ? Array.from(list.querySelectorAll('input[type=checkbox]:checked')).map((c) => c.value) : [];
}

// Redraws the list, keeping what's ticked and what's searched for.
function drawList(){
  if (!list) return;
  const ticked = new Set(checkedIds());
  list.innerHTML = data.friends.map((f) => UI.inviteRow(f, data.onList)).join('');
  list.querySelectorAll('input[type=checkbox]').forEach((c) => { c.checked = ticked.has(c.value); });
  filter();
  count();
}

// The search box: friends whose name has what's typed in it.
function filter(){
  if (!list) return;
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  list.querySelectorAll('.person').forEach((row) => {
    const match = !q || row.getAttribute('data-name').includes(q);
    row.classList.toggle('hidden', !match);
    if (match) shown++;
  });
  document.getElementById('noMatch').classList.toggle('hidden', shown > 0);
}

function count(){
  if (!sendBtn) return;
  const n = checkedIds().length;
  sendBtn.disabled = n === 0;
  sendBtn.textContent = n ? t('invite.inviteSome', { count: n }) : 'Invite';
}

if (list){
  search.addEventListener('input', filter);
  list.addEventListener('change', count);
}

// The rest of your friends, after the first hundred, so the search
// finds them too.
(async function loadRest(){
  for (let i = 0; list && data.nextCursor && i < 10; i++){
    let answer;
    try{ answer = await api('GET', '/me/friends?limit=100&cursor=' + encodeURIComponent(data.nextCursor)); }catch(e){ return; }
    if (!answer.res.ok) return;
    data.friends = data.friends.concat(answer.data.friends);
    data.nextCursor = answer.data.nextCursor;
    drawList();
  }
})();

onActions({
  // Up to 100 at a time, which is what the API takes in one request.
  send: (btn) => {
    const ids = checkedIds();
    const notice = document.getElementById('inviteNotice');
    notice.textContent = '';
    let refusal = '';
    let invited = 0;
    busy(btn, document.getElementById('inviteError'), async () => {
      for (let i = 0; i < ids.length; i += 100){
        const { res, data: d } = await api('POST', '/events/' + encodeURIComponent(data.event.id) + '/invites', { personIds: ids.slice(i, i + 100) });
        if (!res.ok){ refusal = sentence(d.error); break; }
        d.invited.forEach((p) => { data.onList[p.id] = 'invited'; invited++; });
        // Already on the list (they answered meanwhile): not one to offer.
        d.skipped.forEach((s) => { if (s.reason === 'already_on_list' && !data.onList[s.personId]) data.onList[s.personId] = 'invited'; });
      }
      drawList();
    }).then(() => {
      if (invited) notice.textContent = invited === 1 ? t('invite.invitedOne') : t('invite.invited', { count: invited });
      if (refusal) document.getElementById('inviteError').textContent = refusal;
      count();
    });
  }
});
</script>
</body>
</html>
