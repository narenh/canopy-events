<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>__PAGE_TITLE__</title>
<meta name="theme-color" content="#03120c">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/events.css">
</head>
<!-- Your events (/). Signed in: four tabs (?tab=), All (everything
     coming up), Invited (answer them right there), Hosting and Past, each
     from GET /api/v1/me/events/<list>, drawn by public/ui.js (homeLists)
     into #lists. Signed out: what this is, and sign in. -->
<body class="mesh-bg">
<!-- PAGE:HEADER -->
<main class="wrap">
  <!-- PAGE:BANNER -->
  <div id="main" class="stack"><!-- PAGE:MAIN --></div>
</main>
<!-- PAGE:FOOTER -->
<script type="application/json" id="pageData">__PAGE_DATA__</script>
<script src="/copy.js"></script>
<script src="/ui.js"></script>
<script src="/events.js"></script>
<script>
applyCopy();

const data = pageData();
const zone = viewerZone();
const lists = document.getElementById('lists');

// The selected tab's panel, drawn again (the tabs stay, so focus does).
function draw(){
  const panel = document.getElementById('homePanel');
  if (panel) panel.outerHTML = UI.homePanel(data, { viewerZone: zone });
}
if (lists && data.drawnZone !== zone) draw();

// The tabs: every tab's first page came with the page, so choosing one
// just draws it. The address says which (?tab=), replaced rather than
// pushed, so a reload or coming back to the page keeps it without the
// back button stepping through tabs.
function selectTab(name, focus){
  data.tab = UI.homeTabOf(name);
  lists.querySelectorAll('[role="tab"]').forEach((el) => {
    const on = el.getAttribute('data-tab') === data.tab;
    el.setAttribute('aria-selected', on ? 'true' : 'false');
    el.tabIndex = on ? 0 : -1;
    if (on && focus) el.focus();
  });
  draw();
  history.replaceState(history.state, '', UI.homeTabHref(data.tab));
}
if (lists){
  const tabs = () => Array.from(lists.querySelectorAll('[role="tab"]'));
  lists.addEventListener('click', (e) => {
    const tab = e.target.closest('[role="tab"]');
    // A new tab or window (a modifier, or the middle button) is the link's.
    if (!tab || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    selectTab(tab.getAttribute('data-tab'), true);
  });
  lists.addEventListener('keydown', (e) => {
    const tab = e.target.closest('[role="tab"]');
    if (!tab) return;
    const all = tabs();
    const at = all.indexOf(tab);
    const to = { ArrowRight: at + 1, ArrowLeft: at - 1, Home: 0, End: all.length - 1 }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    selectTab(all[(to + all.length) % all.length].getAttribute('data-tab'), true);
  });
}

// One list from its first page again.
async function reload(name){
  const { res, data: d } = await api('GET', '/me/events/' + name + '?limit=' + data.sizes[name]);
  if (res.ok) data.lists[name] = d;
}

// The calendar button: its popover is the Calendar card. It opens under
// the button with focus inside it; Escape, a tap anywhere else, or the
// button again shuts it, and focus goes back to the button.
const calBtn = document.getElementById('calendarBtn');
const calPop = document.getElementById('calendarPopover');
if (calBtn && calPop){
  const shut = (focus) => {
    if (calPop.hidden) return;
    calPop.hidden = true;
    calBtn.setAttribute('aria-expanded', 'false');
    if (focus) calBtn.focus();
  };
  calBtn.addEventListener('click', () => {
    if (!calPop.hidden) return shut(true);
    calPop.hidden = false;
    calBtn.setAttribute('aria-expanded', 'true');
    const first = calPop.querySelector('a[href], button, input');
    if (first) first.focus();
  });
  document.addEventListener('click', (e) => {
    if (!calPop.hidden && !e.target.closest('#calendarPopover') && !e.target.closest('#calendarBtn')) shut(false);
  }, true);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !calPop.hidden){ e.preventDefault(); shut(true); } });
}

// The Calendar card's switch: invitations in your Canopy calendar or not
// (PATCH /api/v1/me/settings). If it doesn't save, it flips back.
const invitesSwitch = document.getElementById('calendarInvites');
if (invitesSwitch){
  invitesSwitch.addEventListener('change', () => {
    const want = invitesSwitch.checked;
    let saved = false;
    let failed = '';
    busy(invitesSwitch, document.getElementById('calendarError'), async () => {
      const { res, data: d } = await api('PATCH', '/me/settings', { calendarInvites: want });
      if (!res.ok){ failed = sentence(d.error); return; }
      saved = true;
      invitesSwitch.checked = d.calendarInvites;
    }).then(() => {
      if (!saved) invitesSwitch.checked = !want;
      if (failed) document.getElementById('calendarError').textContent = failed;
    });
  });
}

// A declined event's dropdown: changing it answers again (going or
// maybe), the same as the buttons.
if (lists){
  lists.addEventListener('change', (e) => {
    const sel = e.target.closest('select[data-change="reply"]');
    if (!sel) return;
    const card = sel.closest('[data-event]');
    const errorEl = card.querySelector('.error');
    let refusal = '';
    busy(sel, errorEl, async () => {
      const { res, data: d } = await api('PUT', '/events/' + encodeURIComponent(card.getAttribute('data-event')) + '/rsvp', { status: sel.value });
      if (!res.ok) refusal = sentence(d.error);
      await Promise.all([reload('invitations'), reload('declined'), reload('all')]);
      draw();
    }).then(() => {
      if (refusal){
        const again = lists.querySelector('[data-event="' + card.getAttribute('data-event') + '"] .error');
        if (again) again.textContent = refusal;
      }
    });
  });
}

onActions({
  // Going or can't go, straight from the invitation (on All or Invited).
  // It then shows as going on All and leaves Invited, or leaves both.
  reply: (btn) => {
    const card = btn.closest('[data-event]');
    const errorEl = card.querySelector('.error');
    let refusal = '';
    busy(btn, errorEl, async () => {
      const { res, data: d } = await api('PUT', '/events/' + encodeURIComponent(card.getAttribute('data-event')) + '/rsvp', { status: btn.getAttribute('data-status') });
      if (!res.ok) refusal = sentence(d.error);
      await Promise.all([reload('invitations'), reload('declined'), reload('all')]);
      draw();
    }).then(() => {
      if (refusal){
        const again = lists.querySelector('[data-event="' + card.getAttribute('data-event') + '"] .error');
        if (again) again.textContent = refusal;
      }
    });
  },

  // The next page of a list, added to the end.
  more: (btn) => busy(btn, null, async () => {
    const name = btn.getAttribute('data-list');
    const list = data.lists[name];
    const { res, data: d } = await api('GET', '/me/events/' + name + '?limit=' + data.sizes[name] + '&cursor=' + encodeURIComponent(list.nextCursor));
    if (!res.ok) return;
    list.events = list.events.concat(d.events);
    list.nextCursor = d.nextCursor;
    draw();
  })
});
</script>
</body>
</html>
