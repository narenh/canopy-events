<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>__PAGE_TITLE__</title>
<meta name="theme-color" content="#03120c">
<meta name="robots" content="noindex, nofollow">
<!-- The link preview: title, when, the place's name, and the cover
     image when there is one. lib/render.js's eventMeta(). -->
<!-- PAGE:META -->
<link rel="stylesheet" href="/events.css">
</head>
<!-- An event: what a shared link opens. The content is drawn by
     public/ui.js (eventPage), on the server first and again here after a
     change. Its sections, top to bottom, each a card with an id:

       #details        the event: the cover, title, when, where, hosts,
                       counts (people and their plus-ones), spots left,
                       the description
       #rsvp           signed out: RSVP (quick sign-up) and sign in;
                       signed in: going / maybe / can't go, the guests
                       they're bringing, the waitlist; or, for someone a
                       host removed, a calm line saying so
       #host           hosts instead of #rsvp: share, invite, edit; the
                       creator also cancels, makes a new link, and adds
                       and removes co-hosts; a co-host can step down;
                       any host puts their lists on it (Lists…) and
                       shows their QR codes (Show list QR, a sheet)
       #joinList       a guest (or someone signed out) not on a list
                       that's on the event: "Get invited next time" and
                       Join <list>
       #friends-going  friends going, when there are any
       #guests         who's coming, by the host's visibility rule; for
                       hosts, "Remove" on each, and who's been removed
       #wall           the activity wall: posts and what happened -->
<body class="mesh-bg">
<!-- PAGE:HEADER -->
<main class="wrap">
  <!-- PAGE:BANNER -->
  <article id="main" class="stack event"><!-- PAGE:MAIN --></article>
</main>
<!-- PAGE:FOOTER -->
<script type="application/json" id="pageData">__PAGE_DATA__</script>
<script src="/copy.js"></script>
<script src="/ui.js"></script>
<script src="/events.js"></script>
<script>
applyCopy();

const data = pageData();
const zone = viewerZone();
const main = document.getElementById('main');
const GUESTS = 50;
const WALL = 20;

// The event's API path. Its id is its link, which a new link changes.
function eventPath(){
  return '/events/' + encodeURIComponent(data.event.id);
}

// Draws the page again from `data`, keeping anything half-typed on the
// wall.
function draw(){
  const box = document.getElementById('wallText');
  const typed = box ? box.value : '';
  const focused = !!box && document.activeElement === box;
  main.innerHTML = UI.eventPage(data, { viewerZone: zone });
  const again = document.getElementById('wallText');
  if (again && typed) again.value = typed;
  if (again && focused) again.focus();
}
// The server drew the times for the zone it knew (or for none, with a
// label on everything). Only redraw if this viewer's is different.
if (data.drawnZone !== zone) draw();

// Attending's row of faces: as many as fit this row's width, at least
// MIN_GAP apart (the server drew it for a phone). Worked out again when
// the window changes size.
const MIN_GAP = 5;
function fitAvatars(){
  const row = document.getElementById('attendRow');
  if (!row) return false;
  const size = parseFloat(getComputedStyle(row).getPropertyValue('--av')) || 56;
  const slots = Math.max(2, Math.floor((row.clientWidth + MIN_GAP) / (size + MIN_GAP)));
  if (slots === data.attendSlots) return false;
  data.attendSlots = slots;
  return true;
}
if (fitAvatars()) draw();
let resizing = null;
window.addEventListener('resize', () => {
  clearTimeout(resizing);
  resizing = setTimeout(() => { if (fitAvatars()) draw(); }, 150);
});
// The ⋯ menu (the host's, or a guest's: a page has one or the other):
// opens under its button, arrow keys move through it, Escape (or a tap
// anywhere else, or picking something) shuts it and puts focus back on
// the button.
function menuParts(){
  const host = document.getElementById('hostMenuBtn');
  return host
    ? { btn: host, menu: document.getElementById('hostMenu') }
    : { btn: document.getElementById('guestMenuBtn'), menu: document.getElementById('guestMenu') };
}
function closeMenu(focusButton){
  const { btn, menu } = menuParts();
  if (!menu || menu.hidden) return;
  menu.hidden = true;
  btn.setAttribute('aria-expanded', 'false');
  if (focusButton) btn.focus();
}
function openMenu(){
  const { btn, menu } = menuParts();
  menu.hidden = false;
  btn.setAttribute('aria-expanded', 'true');
  const first = menu.querySelector('[role=menuitem]');
  if (first) first.focus();
}
document.addEventListener('click', (e) => {
  const { menu } = menuParts();
  if (!menu || menu.hidden) return;
  if (e.target.closest('#hostMenuBtn, #guestMenuBtn')) return;
  // A tap outside, or on an item (whose own action then runs).
  closeMenu(false);
}, true);
document.addEventListener('keydown', (e) => {
  const { menu } = menuParts();
  if (!menu || menu.hidden) return;
  const items = Array.from(menu.querySelectorAll('[role=menuitem]'));
  const at = items.indexOf(document.activeElement);
  if (e.key === 'Escape'){ e.preventDefault(); closeMenu(true); }
  else if (e.key === 'ArrowDown'){ e.preventDefault(); items[(at + 1) % items.length].focus(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); items[(at - 1 + items.length) % items.length].focus(); }
  else if (e.key === 'Home'){ e.preventDefault(); items[0].focus(); }
  else if (e.key === 'End'){ e.preventDefault(); items[items.length - 1].focus(); }
  else if (e.key === 'Tab') closeMenu(false);
});

// "View all" stays open (or shut) when the page is drawn again.
document.addEventListener('toggle', (e) => {
  if (e.target && e.target.id === 'viewAll') data.showAll = e.target.open;
}, true);

function show(id, text){
  const el = document.getElementById(id);
  if (el) el.textContent = text;
}

// The words for a refusal: copy.js's for the reasons it knows (under
// COPY[group].errors), otherwise the API's own sentence.
function refusal(group, d, vars){
  const words = COPY[group] && COPY[group].errors && COPY[group].errors[d.reason];
  return words ? t(group + '.errors.' + d.reason, vars) : sentence(d.error);
}

function viewer(){
  return data.event.viewer || {};
}

// Everything under the event again, after a change: the event itself
// (with `withEvent`), then the guest list, the removed (hosts) and the
// wall, as far as this viewer now sees them. Answering can be what lets
// someone see the names; being made or stepping down as a co-host
// changes what's theirs to see.
async function refresh(withEvent){
  if (withEvent){
    const again = await api('GET', eventPath());
    if (again.res.ok) data.event = again.data.event;
  }
  const v = viewer();
  const insider = !!data.me && !(v.rsvp && v.rsvp.status === 'removed');
  const [g, removed, wall] = await Promise.all([
    insider ? api('GET', eventPath() + '/guests?limit=' + GUESTS) : null,
    insider && v.canEdit ? api('GET', eventPath() + '/guests?status=removed&limit=' + GUESTS) : null,
    insider ? api('GET', eventPath() + '/wall?limit=' + WALL) : null
  ]);
  data.guests = g && g.res.ok ? g.data : (insider ? data.guests : null);
  data.removed = removed && removed.res.ok ? removed.data : null;
  data.wall = wall && wall.res.ok ? wall.data : (insider ? data.wall : null);
}

// An answer (with the guests it brings), or taking it back. Both answer
// with the whole event.
async function answer(body, btn){
  let words = '';
  await busy(btn, document.getElementById('rsvpError'), async () => {
    const { res, data: d } = await api('PUT', eventPath() + '/rsvp', body);
    if (res.ok){
      data.event = d.event;
      data.pendingGuests = 0;
      await refresh(false);
      draw();
      return;
    }
    // Cancelled, over, now hosting it, no room: say why, and show it as
    // it is.
    words = refusal('event', d);
    await refresh(true);
    draw();
  });
  if (words) show('rsvpError', words);
}

// The plus-ones the answer would bring: what the stepper shows, never
// more than the host allows now (an answer over the limit changes to
// fit, as the note under it says).
function guestsToSend(status){
  if (status === 'not_going') return 0;
  return Math.min(UI.guestsShown(data.event, data), data.event.guestsAllowed || 0);
}

// One more or one fewer guest. Before answering, it's only remembered
// (the answer takes it along); after, it changes the answer.
function stepGuests(btn){
  const e = data.event;
  const now = UI.guestsShown(e, data);
  const next = Math.max(0, Math.min(now + Number(btn.getAttribute('data-delta')), e.guestsAllowed || 0));
  const rsvp = viewer().rsvp;
  const status = rsvp && ['going', 'maybe', 'waitlisted'].includes(rsvp.status) ? rsvp.status : null;
  if (!status){
    data.pendingGuests = next;
    draw();
    return;
  }
  if (next === now) return;
  answer('PUT', { status: status === 'waitlisted' ? 'going' : status, guests: next }, btn);
}

// Cancelling, or bringing it back. The creator only.
async function setStatus(status, btn){
  if (!confirm(t(status === 'cancelled' ? 'event.cancelConfirm' : 'event.restoreConfirm'))) return;
  let words = '';
  await busy(btn, document.getElementById('hostError'), async () => {
    const { res, data: d } = await api('PATCH', eventPath(), { status });
    if (!res.ok){ words = refusal('event', d); return; }
    data.event = d.event;
    await refresh(false);
    draw();
  });
  if (words) show('hostError', words);
}

// A change from the host's area or the guest list that answers with the
// event or { ok }: `work` makes the request; then everything is fetched
// again. A refusal is said in `errorId`.
async function hostChange(btn, errorId, group, work, vars){
  let words = '';
  await busy(btn, document.getElementById(errorId), async () => {
    const { res, data: d } = await work();
    if (!res.ok){ words = refusal(group, d, vars); return; }
    if (d.event) data.event = d.event;
    await refresh(!d.event);
    draw();
  });
  if (words) show(errorId, words);
}

// A guest-menu change that answers with the event: drawn again, and
// `noticeKey` said under the card's heading.
async function guestChange(btn, work, noticeKey){
  let words = '';
  let done = false;
  await busy(btn, document.getElementById('guestError'), async () => {
    const { res, data: d } = await work();
    if (!res.ok){ words = refusal('event', d); return; }
    data.event = d.event;
    draw();
    done = true;
  });
  if (words) show('guestError', words);
  if (done) show('guestNotice', t(noticeKey));
}

// Opting out of a host's invitations (PUT), or allowing them again
// (DELETE): the visitor's own list, kept in `data.optouts`.
async function optoutChange(btn, method){
  const id = btn.getAttribute('data-person');
  const name = btn.getAttribute('data-name');
  let words = '';
  let done = false;
  await busy(btn, document.getElementById('guestError'), async () => {
    const { res, data: d } = await api(method, '/me/invite-optouts/' + encodeURIComponent(id));
    if (!res.ok){ words = refusal('event', d); return; }
    const list = (data.optouts || []).filter((x) => x !== id);
    data.optouts = method === 'PUT' ? list.concat([id]) : list;
    draw();
    done = true;
  });
  if (words) show('guestError', words);
  if (done) show('guestNotice', t(method === 'PUT' ? 'event.optedOut' : 'event.optedIn', { name }));
}

async function copyLink(url){
  try{
    await navigator.clipboard.writeText(url);
    show('hostNotice', t('event.copied'));
  }catch(e){
    window.prompt('', url);
  }
}

// Posting on the wall. The form is drawn again with the page, so the
// listener is the document's.
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'wallForm') return;
  e.preventDefault();
  const box = document.getElementById('wallText');
  const text = box.value.trim();
  if (!text){ box.focus(); return; }
  let words = '';
  busy(document.getElementById('wallPost'), document.getElementById('wallError'), async () => {
    const { res, data: d } = await api('POST', eventPath() + '/wall', { text });
    if (!res.ok){ words = refusal('wall', d); return; }
    data.wall.entries.unshift(d.entry);
    box.value = '';
    draw();
  }).then(() => { if (words) show('wallError', words); });
});

// ---------------- Sheets over the page ----------------
//
// "Show list QR" and the invite sheet: drawn into one box at the end of
// the body (outside #main, so redrawing the page leaves them alone), a
// dialog with the page behind it shut off. Escape, the close button or a
// tap on the backdrop closes it; Tab stays inside while it's open; focus
// goes back to whatever opened it.
const sheetBox = document.createElement('div');
sheetBox.id = 'sheetBox';
document.body.appendChild(sheetBox);
let sheet = null; // { opener, onClose }

function sheetFocusables(){
  const panel = sheetBox.querySelector('[role=dialog]');
  return panel ? Array.from(panel.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), a[href], [tabindex="0"]'))
    .filter((el) => el.offsetParent !== null || el === document.activeElement) : [];
}
function openSheet(html, { opener, onClose, focus } = {}){
  sheetBox.innerHTML = html;
  sheet = { opener: opener || document.activeElement, onClose };
  document.body.classList.add('sheet-open');
  main.setAttribute('inert', '');
  const first = (focus && sheetBox.querySelector(focus)) || sheetFocusables()[0];
  if (first) first.focus({ preventScroll: true });
}
function closeSheet(){
  if (!sheet) return;
  const { opener, onClose } = sheet;
  sheet = null;
  sheetBox.innerHTML = '';
  document.body.classList.remove('sheet-open');
  main.removeAttribute('inert');
  if (onClose) onClose();
  // The button that opened it may have been drawn again meanwhile.
  const back = opener && document.body.contains(opener) ? opener
    : (opener && opener.id ? document.getElementById(opener.id) : null) || document.getElementById('hostMenuBtn');
  if (back) back.focus();
}
sheetBox.addEventListener('click', (e) => {
  if (e.target.classList && e.target.classList.contains('sheet-backdrop')) closeSheet();
});
document.addEventListener('keydown', (e) => {
  if (!sheet) return;
  if (e.key === 'Escape'){ e.preventDefault(); closeSheet(); return; }
  if (e.key !== 'Tab') return;
  const inside = sheetFocusables();
  if (!inside.length) return;
  const i = inside.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0){ e.preventDefault(); inside[inside.length - 1].focus(); }
  else if (!e.shiftKey && i === inside.length - 1){ e.preventDefault(); inside[0].focus(); }
});

// ---------------- Lists ----------------
//
// A guest's "Get invited next time" (joining the list there and then),
// and a host's "Lists…" (put their lists on the event, take them off,
// make a new one) and "Show list QR" (big, for the door).

async function loadMyLists(){
  const { res, data: d } = await api('GET', '/me/lists');
  data.myLists = res.ok ? d.lists : [];
}

function listRefusal(d, vars){
  return refusal('lists', d, vars);
}

// Putting a list on: everyone on it is invited (asked first, since it
// tells them), then the guest list is fetched again.
async function attachList(id, name, btn){
  let words = '';
  let said = '';
  await busy(btn, document.getElementById('listsError'), async () => {
    const { res, data: d } = await api('PUT', eventPath() + '/lists/' + encodeURIComponent(id));
    if (!res.ok){ words = listRefusal(d); return; }
    data.event = d.event;
    const n = d.invitedCount;
    said = n === 0 ? t('lists.attachedNone', { list: name }) : n === 1 ? t('lists.attachedOne', { list: name }) : t('lists.attached', { count: n, list: name });
    await refresh(false);
    draw();
  });
  if (words) show('listsError', words);
  if (said) show('listsNotice', said);
}

// Making a list from the event: made, then put on it (it's empty, so
// nobody is invited yet; people who join from its QR code will be).
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'newEventList') return;
  e.preventDefault();
  const input = document.getElementById('newEventListName');
  const name = input.value.trim();
  if (!name){ input.focus(); return; }
  let words = '';
  busy(document.getElementById('newEventListBtn'), document.getElementById('listsError'), async () => {
    const { res, data: d } = await api('POST', '/me/lists', { name });
    if (!res.ok){ words = listRefusal(d); return; }
    data.myLists = (data.myLists || []).concat([d.list]);
    await attachList(d.list.id, d.list.name, null);
  }).then(() => { if (words) show('listsError', words); });
});

onActions({
  // Joining the list a guest was offered: on it, and invited to what it's
  // on (this event included, if they weren't already). The card says so.
  'join-list': (btn) => {
    const code = btn.getAttribute('data-code');
    const joined = { name: btn.getAttribute('data-name'), first: btn.getAttribute('data-first') };
    let words = '';
    busy(btn, document.getElementById('joinListError'), async () => {
      const { res, data: d } = await api('POST', '/list-links/' + encodeURIComponent(code) + '/join');
      if (!res.ok){ words = listRefusal(d); return; }
      data.joinedList = joined;
      await refresh(true);
      draw();
      const card = document.querySelector('#joinList .joined');
      if (card){ card.setAttribute('tabindex', '-1'); card.focus(); }
    }).then(() => { if (words) show('joinListError', words); });
  },

  lists: async () => {
    data.showLists = true;
    draw();
    const box = document.getElementById('eventLists');
    if (box) box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    try{ await loadMyLists(); }catch(e){ data.myLists = []; }
    draw();
  },
  'attach-list': (btn) => {
    const name = btn.getAttribute('data-name');
    if (Number(btn.getAttribute('data-count')) > 0 && !confirm(t('lists.attachConfirm', { list: name }))) return;
    attachList(btn.getAttribute('data-list'), name, btn);
  },
  'detach-list': (btn) => {
    const name = btn.getAttribute('data-name');
    if (!confirm(t('lists.detachConfirm', { list: name }))) return;
    let words = '';
    busy(btn, document.getElementById('listsError'), async () => {
      const { res, data: d } = await api('DELETE', eventPath() + '/lists/' + encodeURIComponent(btn.getAttribute('data-list')));
      if (!res.ok){ words = listRefusal(d); return; }
      data.event = d.event;
      draw();
    }).then(() => { if (words) show('listsError', words); });
  },
  'show-list-qr': () => {
    const lists = data.event.hostLists || [];
    if (!lists.length) return;
    openSheet(UI.listQrSheet(lists), { opener: document.getElementById('hostMenuBtn') });
  },
  'close-list-qr': () => closeSheet()
});

onActions({
  answer: (btn) => {
    const status = btn.getAttribute('data-status');
    answer({ status, guests: guestsToSend(status) }, btn);
  },
  'host-menu': (btn) => {
    if (btn.getAttribute('aria-expanded') === 'true') closeMenu(true);
    else openMenu();
  },
  'guest-menu': (btn) => {
    if (btn.getAttribute('aria-expanded') === 'true') closeMenu(true);
    else openMenu();
  },

  // A guest's menu. Muting changes only `viewer.muted`; leaving takes
  // them off the event, so everything is fetched again (they now see it
  // as anyone opening the link would); opting out of a host's invites
  // changes only their own list.
  mute: (btn) => guestChange(btn, () => api('PUT', eventPath() + '/mute'), 'event.muted'),
  unmute: (btn) => guestChange(btn, () => api('DELETE', eventPath() + '/mute'), 'event.unmuted'),
  leave: (btn) => {
    if (!confirm(t('event.leaveConfirm'))) return;
    hostChange(btn, 'guestError', 'event', () => api('POST', eventPath() + '/leave'));
  },
  'optout-invites': (btn) => optoutChange(btn, 'PUT'),
  'allow-invites': (btn) => optoutChange(btn, 'DELETE'),

  // The co-hosts, from the menu: shown in the host's area.
  cohosts: () => {
    data.showCohosts = true;
    draw();
    const box = document.getElementById('cohosts');
    if (box) box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  },

  // Deleting, for good. The confirm names the event, and when people
  // have said they're coming, says cancelling would tell them.
  'delete-event': () => {
    const e = data.event;
    const coming = ((e.counts || {}).going || 0) + ((e.counts || {}).maybe || 0);
    const live = UI.phaseOf(e) === 'upcoming' || UI.phaseOf(e) === 'now';
    const words = live && coming
      ? (coming === 1 ? t('event.deleteConfirmOne', { title: e.title }) : t('event.deleteConfirmComing', { title: e.title, count: coming }))
      : t('event.deleteConfirm', { title: e.title });
    if (!confirm(words)) return;
    let refused = '';
    busy(null, document.getElementById('hostError'), async () => {
      const { res, data: d } = await api('DELETE', eventPath());
      if (!res.ok){ refused = refusal('event', d); return; }
      window.location.href = '/';
    }).then(() => { if (refused) show('hostError', refused); });
  },
  guests: (btn) => stepGuests(btn),
  cancel: (btn) => setStatus('cancelled', btn),
  restore: (btn) => setStatus('active', btn),

  // The phone's share sheet where there is one; otherwise the link is
  // copied.
  share: async (btn) => {
    const url = btn.getAttribute('data-url');
    if (navigator.share){
      try{ await navigator.share({ title: btn.getAttribute('data-title'), url }); }catch(e){}
      return;
    }
    copyLink(url);
  },
  copy: (btn) => copyLink(btn.getAttribute('data-url')),
  select: (el) => el.select(),

  // A new link: the old one stops working for everyone. This page moves
  // to the new one, and shows it to share.
  'new-link': (btn) => {
    if (!confirm(t('event.newLinkConfirm'))) return;
    let words = '';
    busy(btn, document.getElementById('hostError'), async () => {
      const { res, data: d } = await api('POST', eventPath() + '/new-link');
      if (!res.ok){ words = refusal('event', d); return; }
      data.event = d.event;
      data.newLink = true;
      history.replaceState(null, '', '/e/' + encodeURIComponent(d.event.id));
      draw();
      const box = document.getElementById('newLink');
      if (box) box.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }).then(() => { if (words) show('hostError', words); });
  },

  'remove-cohost': (btn) => {
    const name = btn.getAttribute('data-name');
    if (!confirm(t('event.removeCohostConfirm', { name }))) return;
    hostChange(btn, 'cohostError', 'cohosts', () => api('DELETE', eventPath() + '/cohosts/' + encodeURIComponent(btn.getAttribute('data-person'))), { name });
  },

  // A co-host steps down: they're a guest again (invited), and the page
  // turns into a guest's.
  'step-down': (btn) => {
    if (!confirm(t('event.stepDownConfirm'))) return;
    hostChange(btn, 'cohostError', 'cohosts', () => api('DELETE', eventPath() + '/cohosts/' + encodeURIComponent(data.me.id)));
  },

  'remove-guest': (btn) => {
    if (!confirm(t('event.removeGuestConfirm', { name: btn.getAttribute('data-name') }))) return;
    hostChange(btn, 'guestsError', 'event', () => api('PUT', eventPath() + '/removed/' + encodeURIComponent(btn.getAttribute('data-person'))));
  },
  'undo-remove': (btn) => hostChange(btn, 'guestsError', 'event', () => api('DELETE', eventPath() + '/removed/' + encodeURIComponent(btn.getAttribute('data-person')))),

  'more-guests': (btn) => busy(btn, null, async () => {
    const { res, data: g } = await api('GET', eventPath() + '/guests?limit=' + GUESTS + '&cursor=' + encodeURIComponent(data.guests.nextCursor));
    if (!res.ok) return;
    data.guests.guests = data.guests.guests.concat(g.guests);
    data.guests.nextCursor = g.nextCursor;
    draw();
  }),

  'more-wall': (btn) => busy(btn, null, async () => {
    const { res, data: w } = await api('GET', eventPath() + '/wall?limit=' + WALL + '&cursor=' + encodeURIComponent(data.wall.nextCursor));
    if (!res.ok) return;
    data.wall.entries = data.wall.entries.concat(w.entries);
    data.wall.nextCursor = w.nextCursor;
    draw();
  }),

  // Your own post, or (hosts) anything on the wall.
  'delete-entry': (btn) => {
    if (!confirm(t(btn.getAttribute('data-type') === 'post' ? 'wall.deleteConfirm' : 'wall.deleteEntryConfirm'))) return;
    const id = btn.getAttribute('data-entry');
    let words = '';
    busy(btn, document.getElementById('wallError'), async () => {
      const { res, data: d } = await api('DELETE', eventPath() + '/wall/' + encodeURIComponent(id));
      if (!res.ok && res.status !== 404){ words = refusal('wall', d); return; }
      data.wall.entries = data.wall.entries.filter((x) => x.id !== id);
      draw();
    }).then(() => { if (words) show('wallError', words); });
  }
});
</script>
</body>
</html>
